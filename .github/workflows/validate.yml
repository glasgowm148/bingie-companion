name: Validate companions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  kodi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.17.0
      - run: ruff check --no-cache .
      - run: python -m unittest discover -s tests -q
      - run: python scripts/build.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sdkmanager 'build-tools;34.0.0' 'platforms;android-30'
      - run: python3 android/voice-search/build.py --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
